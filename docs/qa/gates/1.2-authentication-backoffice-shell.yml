schema: 1
story: '1.2'
gate: CONCERNS
status_reason: >
  All 10 acceptance criteria met; auth implementation is correct and secure for MVP scope.
  Two non-blocking findings tracked: missing unit tests for the authorize() function and
  absence of rate limiting on the login endpoint (acceptable for MVP, required before production).
reviewer: Quinn
updated: '2026-05-13T00:00:00Z'
top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: 'No unit tests for authorize() in src/lib/auth.ts or login form behavior'
    suggested_action: >
      Add unit tests for: (1) authorize() with valid credentials, invalid email, invalid
      password, missing ADMIN_PASSWORD_HASH; (2) LoginForm renders error message when
      error prop is provided. Consider adding these in Story 1.3 or a dedicated test story.

  - id: 'SEC-002'
    severity: medium
    finding: 'No rate limiting on /api/auth/callback/credentials — brute-force risk in production'
    suggested_action: >
      Add rate limiting middleware (e.g., next-rate-limit or Vercel Edge Middleware) before
      production deployment. Track as a pre-production hardening item outside MVP scope.

  - id: 'SEC-003'
    severity: low
    finding: >
      Timing oracle in authorize(): email mismatch returns before bcrypt.compare() runs,
      creating a fast-path vs slow-path timing difference that could confirm a valid admin email.
    suggested_action: >
      Low risk for single-admin system where email is not a secret. For production hardening,
      consider running bcrypt.compare() against a dummy hash even on email mismatch to normalize
      response time.

  - id: 'MNT-001'
    severity: low
    finding: >
      setIsLoading(false) in login-form.tsx onSubmit is unreachable on success because
      signIn('credentials', { callbackUrl }) redirects before the line executes.
    suggested_action: >
      Cosmetic — no functional impact. Could clean up with a try/finally pattern if desired,
      but not worth a fix in isolation.

waiver: { active: false }

