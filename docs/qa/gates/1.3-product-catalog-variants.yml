schema: 1
story: '1.3'
gate: CONCERNS
status_reason: >
  All 10 acceptance criteria met; product catalog implementation is correct and financially sound for MVP scope.
  Four non-blocking low-severity findings tracked: service layer directly accessing Prisma for SKU collision (bypasses repository), float intermediary in VariantMarginDisplay, platform-sensitive drift test assertion, and missing ownership auth on Server Actions (acceptable for single-admin MVP).
reviewer: Quinn
updated: '2026-05-13T00:00:00Z'
top_issues:
  - id: 'ARCH-001'
    severity: low
    finding: >
      buildSKU() in products.service.ts calls prisma.productVariant.findUnique() directly for SKU
      collision detection, bypassing the repository layer. This creates direct Prisma coupling in
      the service, inconsistent with the Contract Pattern boundary established in AC-2.
    suggested_action: >
      Add ProductsRepository.findBySku(sku) method and route the collision check through it.
      Non-blocking for MVP — address in a future refactor story before the feature grows.

  - id: 'MNT-001'
    severity: low
    finding: >
      VariantMarginDisplay (product-form.tsx) converts price strings via parseFloat() before
      constructing new Decimal(), introducing a float intermediary (e.g. new Decimal(parseFloat("150.00"))).
      For display-only margin (2dp), no precision loss occurs in practice for typical retail prices,
      but it deviates from the "string → Decimal directly" pattern prescribed in Dev Notes.
    suggested_action: >
      Replace parseFloat() with direct string construction: new Decimal(salePrice || '0').
      One-line fix — address alongside any future form refactor.

  - id: 'TEST-001'
    severity: low
    finding: >
      The "no floating-point drift" assertion (products.service.test.ts line 79)
      checks expect(decimalResult.toNumber()).not.toBe(nativeResult). The Decimal result
      66.666...67 and native float 66.666...66 may round to the same IEEE-754 double on
      some JS engines, making this assertion fragile. The primary precision test
      (toFixed(2) === "66.67") is reliable and sufficient.
    suggested_action: >
      Remove the fragile secondary assertion or replace with:
      expect(decimalResult.toString()).toContain('66.6666666666666666666')
      The toFixed(2) test already covers the precision requirement adequately.

  - id: 'SEC-001'
    severity: low
    finding: >
      archiveProductAction(id) and restoreProductAction(id) accept any product ID from any
      authenticated session without verifying product ownership or existence pre-flight.
      For the current single-admin MVP this is not exploitable, but the pattern will need
      authorization guards before multi-user roles are introduced.
    suggested_action: >
      Pre-production: add a service-level existence check (ProductsService.findById throws
      on missing ID, which already propagates). For multi-role: add explicit owner/admin
      check. Track as a pre-production hardening item.

waiver: { active: false }

